name: FAISS tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  faiss:
    name: FAISS / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POETRY_NO_INTERACTION: "1"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.3.1"

      # Full dependencies are needed because src/__init__.py imports all backends.
      # Ubuntu includes the C++ build tools needed by Annoy and HNSWLib.
      - name: Validate lock file
        run: poetry check --lock

      - name: Install locked dependencies
        run: poetry install --no-root --no-ansi

      - name: Report environment
        run: |
          python --version
          poetry --version
          poetry run python --version
          poetry show

      - name: Test FAISS indexes on synthetic data
        run: poetry run pytest tests/test_indexes.py -m "faiss and local and not external_service" --strict-markers -v -ra
